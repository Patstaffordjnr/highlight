  <div class = "home-control">

<div class = "control-row-one"> 
<br>

Search Address
<div class = "progress-bar-container" *ngIf="showDateControls"> 
<app-progress-bar class = "progress-bar"
[selectedTime]="globalDate"
(selectTimeEvent)="onTimeSelected($event)">
</app-progress-bar>
</div>

<div class = "calendar-container" *ngIf="showDateControls"> 
<app-calendar class = "calendar"   [selectedDate]="globalDate" (selectDateEvent)="onDateSelected($event)"></app-calendar>
<br>
<br>
</div>

  <div class = "home-control-genre">
  <div class="genre">
    <div class="genre-item" (click)="allFunction()">
      <div class="all-button" [class.all-button]="allEventsVisible" [class.all-button-selected]="!allEventsVisible"></div>
      <div class="all"></div>
    </div>
    <div class="genre-item" (click)="bandFunction()">
      <div class="band-button" [class.band-button]="bandEventsVisible" [class.band-button-selected]="!bandEventsVisible"></div>
      <div class="band"></div>
    </div>
    <div class="genre-item" (click)="buskerFunction()">
      <div class="busker-button" [class.busker-button]="buskerEventsVisible" [class.busker-button-selected]="!buskerEventsVisible"></div>
      <div class="busker"></div>
    </div>
    <div class="genre-item" (click)="djFunction()">
      <div class="dj-button" [class.dj-button]="djEventsVisible" [class.dj-button-selected]="!djEventsVisible"></div>
      <div class="dj"></div>
    </div>
    <div class="genre-item" (click)="performanceFunction()">
      <div class="performance-button" [class.performance-button]="performanceEventsVisible" [class.performance-button-selected]="!performanceEventsVisible"></div>
      <div class="performance"></div>
    </div>
  </div>
  </div>
</div>
  <div class = "control-row-two"> 
<div class="home-control-search">
  <div class="search">
    <input type="text"
           placeholder="Search…"
           [(ngModel)]="searchText"
           (input)="onSearchChange()">
  </div>
</div>
  <div class = "home-control-sort">
    <div class = "sort">
      <label for="sort-select">Sort by : &nbsp;</label>
      <select id="sort-select" [(ngModel)]="selectedSort" name="sort"  (change)="onSortChange()">
      <option *ngFor="let option of sortOptions" [value]="option.value">
      {{ option.label }}
      </option>
      </select>
    </div>
  </div>
</div>
</div>
