<div class="nav-div">
  <div #sliderRef class="slider" [ngStyle]="{'margin-left': menuVisible ? 'auto' : '47%'}">
    <div #innerSliderRef class="slider-inner">
      <div *ngIf="menuVisible">
        <div class="slider-img" routerLinkActive="nav-active">
          <i class="home" routerLink="/home">Home</i>
        </div>
                <div *ngIf="busker" class="slider-img" routerLinkActive="nav-active">
          <i class="user" routerLink="busker">Busker</i>
        </div>
        <div *ngIf="isLoggedIn" class="slider-img" routerLinkActive="nav-active">
          <i class="user" routerLink="user">User</i>
        </div>
        <div *ngIf="admin" class="slider-img" routerLinkActive="nav-active">
          <i class="user" routerLink="admin">Admin</i>
        </div>
        <div class="slider-img" routerLinkActive="nav-active">
          <i class="buskers" routerLink="buskers">Buskers</i>
        </div>
        <div *ngIf="!isLoggedIn" class="slider-img" routerLinkActive="nav-active">
          <i class="sign-up" routerLink="signup">Sign Up</i>
        </div>
        <div *ngIf="!isLoggedIn" class="slider-img" routerLinkActive="nav-active">
          <i class="log-in" routerLink="login">Log In</i>
        </div>
        <div class="slider-img" routerLinkActive="nav-active">
          <i class="about" routerLink="about">About</i>
        </div>
        <div *ngIf="isLoggedIn" class="slider-img">
          <i (click)="logout()" class="log-out">Log Out</i>
        </div>
        <div *ngIf="isLoggedIn" class="slider-img" routerLinkActive="nav-active">
          <i class="settings" routerLink="settings">Settings</i>
        </div>
        <div class="slider-img" *ngIf="isLoggedIn">
          <i class="profile" (click)="openProfileModal()">
            <img [src]="currentUser.profileImageUrl || '/assets/userprofile.jpg'"
                 class="profile-img"
                 [style.object-position]="(currentUser.imgOffsetX ?? 50) + '% ' + (currentUser.imgOffsetY ?? 50) + '%'"
                 [style.transform]="currentUser.imgZoom && currentUser.imgZoom > 1.0 ? 'scale(' + currentUser.imgZoom + ')' : 'none'"
                 alt="profile">
          </i>
        </div>
      </div>
    </div>
  </div>
</div>

<app-profile-modal
  *ngIf="profileModalOpen"
  [isOpen]="profileModalOpen"
  [currentUser]="currentUser"
  (close)="profileModalOpen = false"
  (profileUpdated)="onProfileUpdated($event)">
</app-profile-modal>
