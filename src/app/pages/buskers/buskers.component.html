<div class="ui">
  <div class="content">
    <div class="buskers">
      <div class="container">

        <div class="item-1-container" *ngIf="hasProfileImage">
          <div class="item item-1">
            <app-user-profile class="user-profile"></app-user-profile>
          </div>
        </div>

        <div class="item-2-container">
          <div class="item item-2"></div>
        </div>

        <div class="item-3-container">
          <div class="item item-3"></div>
        </div>

        <div class="item-4-container">
          <div class="item item-4">
            <app-buskers-table class="buskers-table" [buskers]="buskers" (selectedBusker)="onSelect($event)"></app-buskers-table>
          </div>
        </div>

        <div class="item-5-container">
          <div class="item-5">
            <app-buskers-table-control (filterChange)="onFilterChange($event)"></app-buskers-table-control>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<app-busker-modal [isOpen]="showModal" (close)="showModal = false" [busker]="busker" (openEvent)="onOpenEvent($event)">
</app-busker-modal>

<app-event-modal *ngIf="showEventModal" [isOpen]="showEventModal" [event]="selectedEvent" (close)="showEventModal = false">
</app-event-modal>
