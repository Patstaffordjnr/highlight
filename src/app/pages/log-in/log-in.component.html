<div class="page">
  <div class="card">
    <div class="brand">Highlight</div>
    <p class="tagline">Discover live music near you</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="pat@highlight.ie" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••••••••••••••••••" autocomplete="current-password">
      </div>

      <label class="remember-row">
        <input type="checkbox" formControlName="rememberMe">
        <span>Remember me for 30 days</span>
      </label>

      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" [disabled]="!form.valid || loading">
        {{ loading ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <p class="switch-link">
    <a routerLink="/signup">Sign up?</a>&nbsp;<br><br><a routerLink="/forgot-password">Forgot password?</a>
    </p>
  </div>
</div>
